services:
  app:
    image: proker-desa:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Website Desa}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY:-}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-website_desa}
      DB_USERNAME: ${DB_USERNAME:-website_desa}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      FILESYSTEM_DISK: public
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_framework:/var/www/html/storage/framework
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proker

  queue:
    image: proker-desa:latest
    restart: unless-stopped
    command: php artisan queue:listen --tries=1 --sleep=2
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-website_desa}
      DB_USERNAME: ${DB_USERNAME:-website_desa}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_framework:/var/www/html/storage/framework
    depends_on:
      - app
    networks:
      - proker

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-website_desa}
      MARIADB_USER: ${DB_USERNAME:-website_desa}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - proker

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      - app
    networks:
      - proker

volumes:
  storage_public:
  storage_framework:
  db_data:

networks:
  proker:
