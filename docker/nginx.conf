server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;

    # Laravel: semua request ke front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File upload (/storage/*) disajikan langsung dari volume storage_public.
    # Container nginx tidak memiliki symlink public/storage milik app,
    # jadi dipetakan manual ke mount volume. ^~ agar menang atas aturan statis.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # File statis yang ada langsung disajikan (lebih cepat, tanpa PHP)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # Jangan pernah serve file sensitif
    location ~ /\. {
        deny all;
    }

    location ~ /\.(env|git|log|ini)$ {
        deny all;
    }
}
